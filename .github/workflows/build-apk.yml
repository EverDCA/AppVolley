name: Compilar y Publicar APK (VolleyTrack)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # necesario para crear y publicar releases

jobs:
  build:
    name: Generar y Publicar APK
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sincronizar archivos Web a Android Assets
        run: |
          mkdir -p android/app/src/main/assets/css
          mkdir -p android/app/src/main/assets/js
          cp index.html android/app/src/main/assets/
          cp manifest.json android/app/src/main/assets/
          cp sw.js android/app/src/main/assets/ || true
          cp -r css/* android/app/src/main/assets/css/
          cp -r js/* android/app/src/main/assets/js/

      - name: Instalar y Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Aceptar licencias de Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compilar APK
        run: |
          cd android
          gradle assembleRelease assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar APK para publicar
        run: |
          mkdir -p apk-output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk apk-output/VolleyTrack.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/VolleyTrack.apk
          else
            cp android/app/build/outputs/apk/*/*.apk apk-output/VolleyTrack.apk
          fi
          ls -la apk-output/

      - name: Obtener fecha y hash del commit
        id: meta
        run: |
          echo "date=$(date +'%Y-%m-%d')"    >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::7}"         >> $GITHUB_OUTPUT

      - name: Eliminar release 'latest' anterior (si existe)
        run: |
          gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar Release con APK descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "VolleyTrack — última versión (${{ steps.meta.outputs.date }})"
          body: |
            ## VolleyTrack APK — Compilación automática

            **Commit:** `${{ steps.meta.outputs.sha }}`  
            **Fecha:** ${{ steps.meta.outputs.date }}

            ### Cómo instalar
            1. Descarga el archivo `VolleyTrack.apk` debajo
            2. Ábrelo desde tu Android (activa "Instalar aplicaciones desconocidas" si se solicita)
            3. Tus datos y asistencias se conservan automáticamente

            > Esta versión se genera de forma continua y directa con cada actualización del proyecto.
          files: apk-output/VolleyTrack.apk
          overwrite: true
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir APK también como Artefacto de respaldo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VolleyTrack-APK
          path: apk-output/VolleyTrack.apk
          retention-days: 30
