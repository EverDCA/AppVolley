name: Compilar APK de Android (VolleyTrack)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Generar APK de Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Sincronizar archivos Web a Android Assets
        run: |
          mkdir -p android/app/src/main/assets/css
          mkdir -p android/app/src/main/assets/js
          cp index.html android/app/src/main/assets/
          cp manifest.json android/app/src/main/assets/
          cp -r css/* android/app/src/main/assets/css/
          cp -r js/* android/app/src/main/assets/js/

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK (assembleDebug)
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Renombrar APK a VolleyTrack.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/VolleyTrack.apk

      - name: Subir APK generado como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: VolleyTrack-APK
          path: android/app/build/outputs/apk/debug/VolleyTrack.apk
          retention-days: 30
